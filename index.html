Rumi and the Reed Flute|R|Persia|WAs|Rumi’s poetry opens with a reed lamenting its separation from the reed bed. Explore Sufi ideas of longing, love and return, and the art of whirling devotion.
Griots: Keepers of West African Memory|S|West Africa|NWAf|Hereditary praise-singers and historians, griots preserve epics like Sundiata through music and speech. Consider oral memory, authority and the craft of remembering a people.
Jabir ibn Hayyan and Early Alchemy|E|Abbasid Iraq|WAs|Texts attributed to Jabir blend experiment, symbolism and cosmology in medieval Islamic alchemy. Explore how chemistry and mysticism once shared a vocabulary, and what transmutation symbolised.
Wuxing: The Five Phases|E|China|EAs|Wood, fire, earth, metal and water as cycles of change rather than fixed substances, used in medicine, divination and cosmology. A cultural and historical lens, not a scientific claim.
Göbekli Tepe|H|Anatolia, Türkiye|WAs|Monumental carved pillars raised around 11,000 years ago, before settled farming. Explore what they suggest about ritual, community and the origins of civilisation.
Great Zimbabwe|H|Zimbabwe|ESAf|Vast dry-stone enclosures at the heart of a trading society linked to the Indian Ocean. Explore how colonial-era claims denied African authorship, and what the site really tells.
The Inca Quipu|H|The Andes|Lat|Knotted cords recorded census data, tribute and perhaps narrative. Explore how an empire stayed organised without a written script, and what remains undeciphered.
Camus and the Myth of Sisyphus|P|Algeria and France|NWAf|Camus imagined Sisyphus content with his rock, treating absurdity as a place to live rather than escape. Explore revolt, meaning, and the difference between despair and acceptance.
The Wood Wide Web|N|Global forests|Glo|Fungal networks link tree roots, exchanging nutrients and signals. Explore what is known, what is still debated, and how it challenges thinking about the individual organism.
The Mind of an Octopus|N|Global oceans|Glo|Eight arms with neurons of their own, camouflage, tool use: a brain evolved separately from ours. Explore what intelligence and consciousness might mean in such an alien form.
Madhubani Painting|A|Mithila, India|SAs|Women of Mithila have painted walls and paper with dense patterns of deities, fish, birds and lotus. Explore tradition, symbolism and how domestic art gained worldwide recognition.
Hilma af Klint|A|Sweden|Eu|A pioneer of abstraction whose spiritually inspired paintings stayed hidden for decades. Explore forgotten artists, intention, and who gets remembered.
Samsara and Rebirth|R|India and beyond|SAs|Hindu, Buddhist and Jain traditions understand existence as a cycle, with differing views of what continues and how liberation arises. Compare them rather than merging them.
Samhain and the Celtic Year|M|Ireland and Scotland|Eu|An old Gaelic festival marking the turn to winter, when boundaries between worlds were said to thin. Explore what is known, what is later legend, and how it echoes today.
The Sogdians of the Silk Road|H|Central Asia|CAs|Merchants from Samarkand and beyond carried goods, languages and religions across Eurasia. Explore how trade networks shaped culture, and why their story is often overlooked.
Bayanihan|S|Philippines|SEA|Neighbours carrying a whole house on bamboo poles to a new site. Explore communal labour, reciprocity, and what mutual aid looks like in modern life.
Pachamama|R|The Andes|Lat|In Andean communities Pachamama is earth and mother, honoured with offerings. Explore relationship with land as kinship, and how such ideas appear in modern law.
Mandrake in European Folklore|E|Medieval Europe|Eu|A root shaped like a body, said to scream when pulled. Explore how plants gathered legends, from medicine to magic, as a window into fear and fascination. Folklore, not fact.`;

 const n=S.done.length;S.cur=null;sv();
 const c=CT[ci];let ex='';
 if(n%2==0)ex+='<p>🎨 A painting challenge has been unlocked.</p>';
 if(n%5==0)ex+='<p>🪷 A lotus is blooming in your pond.</p>';
 ov=`<div id="ov"><div class="card">${catSVG(c,150)}<h2>${c.n} has joined you</h2><p>${c.p}</p>${ex}<button class="pr" onclick="closeOv(${n%5==0})">Continue</button></div></div>`;
 r()}
function closeOv(b){ov='';pick('next');if(b)petals(14)}
function petals(n){for(let i=0;i<n;i++){const p=document.createElement('span');p.className='fp';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*3+'s';$('#fx').appendChild(p);setTimeout(()=>p.remove(),13000)}}
function pond(){
 const n=S.done.length;let s='<svg viewBox="0 0 440 170"><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9a86"/><stop offset="1" stop-color="#3f5e4d"/></linearGradient></defs><rect width="440" height="170" fill="url(#w)"/><ellipse class="rp" cx="120" cy="140" rx="70" ry="12"/><ellipse class="rp" cx="320" cy="150" rx="60" ry="10" style="animation-delay:3s"/>';
 const pd='M0 0C-10 -8 -9 -26 0 -34C9 -26 10 -8 0 0Z';
 for(let i=0;i<5;i++){const x=45+i*70;s+=`<path d="M${x} 150Q${x+8} 125 ${x} 106" stroke="#4f7a4a" stroke-width="3" fill="none"/><ellipse cx="${x}" cy="150" rx="26" ry="7" fill="#5f8a5a"/><g transform="translate(${x},106)">`;
  for(const k of[-1.5,-.5,.5,1.5])s+=`<path class="pt" data-i="${i}" data-k="${k}" d="${pd}" fill="#b87a90"/>`;
  s+='<circle cx="0" cy="-6" r="4" fill="#d8b050"/>';
  for(const k of[-2,-1,0,1,2])s+=`<path class="pt" data-i="${i}" data-k="${k}" d="${pd}" fill="#e3a9b9" stroke="#c98ea0" stroke-width=".6"/>`;
  s+='</g>'}
 s+='<ellipse cx="408" cy="152" rx="24" ry="7" fill="#5f8a5a"/><ellipse cx="408" cy="144" rx="9" ry="7" fill="#7aa05c"/><circle cx="403" cy="137" r="3" fill="#7aa05c"/><circle cx="413" cy="137" r="3" fill="#7aa05c"/>';
 for(let j=0;j<Math.min(5,Math.floor(n/5));j++)s+=`<path class="df" transform="translate(${70+j*75},${28+(j%2)*22})" d="M0 0l9-3M0 0l9 3M0 0l-9-3M0 0l-9 3M0 0h-10" stroke="#e0d0f0" stroke-width="1.6"/>`;
 return s+'</svg>'}
function setP(t){document.querySelectorAll('.pt').forEach(e=>{const p=Math.max(0,Math.min(5,t-5*e.dataset.i))/5;e.style.transform=`rotate(${e.dataset.k*(7+p*30)}deg) scale(${.7+.35*p})`})}
function gard(){
 if(S.cur==null){pick('next');return}
 const t=T[S.cur],n=S.done.length,sv_=S.saved.includes(t.id);
 const reg=new Set(S.done.map(i=>T[i].g)).size,cats=new Set(S.done.map(i=>T[i].c)).size;
 const pc=Object.values(S.p).filter(x=>x.img).length;
 $('#v').innerHTML=`<div class="card" id="pond">${pond()}</div>
 <div class="card"><small>${CN[t.c]} · ${t.o}</small><h2>${t.t}</h2><p>${t.d}</p>${S.mood?`<small><i>${S.mood}: ${MT[S.mood]}</i></small>`:''}
 <div class="row"><button class="pr" onclick="done()">Done Journaling</button><button onclick="sav()">${sv_?'Saved ✓':'Save for Later'}</button><button onclick="pick('next')">Skip This Topic</button></div></div>
 <div class="card"><div class="row" style="margin:0"><button onclick="pick('surprise')">Surprise Me</button><button onclick="pick('next')">Another Topic</button><button onclick="pick('new')">Explore Somewhere New</button></div>
 <div class="row"><select onchange="S.cat=this.value;pick('next')"><option value="">Explore a Category</option>${Object.entries(CN).map(([k,v])=>`<option value="${k}" ${S.cat==k?'selected':''}>${v}</option>`).join('')}</select>
 <select onchange="S.mood=this.value;pick('next')"><option value="">Change My Mood</option>${Object.keys(MC).map(m=>`<option ${S.mood==m?'selected':''}>${m}</option>`).join('')}</select></div>
 <small>Skipping is always free. Nothing here is a task.</small></div>
 <div class="card"><small>${n} topics explored · ${n%5} of 5 toward the next bloom · ${S.cats.length} cats · ${Math.min(8,Math.floor(n/2))} paintings unlocked · ${pc} painted · ${S.saved.length} saved · ${cats} of 10 categories · ${reg} regions visited</small></div>`;
 setP(shown);setTimeout(()=>{setP(n);shown=n},120)}
function sav(){const i=S.cur;S.saved=S.saved.includes(i)?S.saved.filter(x=>x!=i):[...S.saved,i];sv();toast(S.saved.includes(i)?'Saved for later':'Removed');r()}
function cats(){$('#v').innerHTML=`<div class="grid">${CT.map((c,i)=>{const k=S.cats.find(x=>x.i==i);return k?`<div class="card">${catSVG(c)}<h3>${c.n}</h3><small>${c.p}<br>Joined ${new Date(k.t).toLocaleDateString()}</small></div>`:'<div class="card"><div style="font-size:60px;opacity:.3">?</div><small>Not yet met</small></div>'}).join('')}</div>`}
function paint(){
 const u=Math.min(8,Math.floor(S.done.length/2));let h='';
 for(let i=0;i<u;i++){const p=PA[i],d=S.p[i]||{};
  h+=`<div class="card"><svg viewBox="0 0 120 90" style="width:100%;border-radius:12px">${p[4]}</svg><h3>${p[0]}</h3><p class="mu">${p[1]}</p><div>${p[2].map(c=>`<span class="sw" style="background:${c}"></span>`).join('')} <small>${p[3]}</small></div>
  ${d.img?`<img class="ph" src="${d.img}" alt="Your painting"><textarea placeholder="In your own words: what did you paint, and what does it mean to you?" onchange="note(${i},this.value)">${esc(d.note)}</textarea><div class="row"><button class="pr" onclick="reflect(${i})">Reflect on my painting</button><label><button onclick="this.nextElementSibling.click()">Replace photo</button><input type="file" accept="image/*" hidden onchange="up(${i},this.files[0])"></label></div>${d.an||''}`:`<div class="row"><button class="pr" onclick="this.nextElementSibling.click()">I’ve Painted This</button><input type="file" accept="image/*" hidden onchange="up(${i},this.files[0])"></div>`}</div>`}
 $('#v').innerHTML=h||'<div class="card">Your first painting challenge unlocks after two completed topics.</div>'}
function note(i,v){S.p[i].note=v;sv()}
function up(i,f){if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.p[i]=Object.assign(S.p[i]||{},{img:c.toDataURL('image/jpeg',.7),an:''});sv();r()};im.src=fr.result};fr.readAsDataURL(f)}
function reflect(i){const p=S.p[i],im=new Image();im.onload=()=>{
 const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);const d=x.getImageData(0,0,48,48).data;
 let L=0,Sa=0,w=0,co=0,ce=0,ed=0,lf=0,rt=0,q={};
 for(let k=0;k<2304;k++){const R=d[k*4],G=d[k*4+1],B=d[k*4+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/510,px=k%48,py=(k/48)|0;
  L+=l;Sa+=(mx-mn)/(mx||1);if(R>B+12)w++;else if(B>R+12)co++;
  if(px>=12&&px<36&&py>=12&&py<36)ce+=l;else ed+=l;if(px<24)lf+=l;else rt+=l;
  const key=((R>>6)<<4)|((G>>6)<<2)|(B>>6);q[key]=(q[key]||0)+1}
 L/=2304;Sa/=2304;ce/=576;ed/=1728;
 const top=Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>{const k=+e[0];return`rgb(${(k>>4&3)*85+42},${(k>>2&3)*85+42},${(k&3)*85+42})`});
 const pc=v=>Math.round(v/23.04);
 const obs=[`About ${pc(w)}% of the image leans warm and ${pc(co)}% cool.`,`Overall it reads as ${L>.62?'light':L<.38?'dark':'mid-toned'}, with ${Sa>.45?'fairly saturated':Sa<.2?'muted':'moderately saturated'} colour.`,ce>ed+.06?'The centre is lighter than the edges.':ce<ed-.06?'The centre is darker than the edges.':'Light is spread fairly evenly from centre to edges.',Math.abs(lf-rt)/1152>.08?`The ${lf>rt?'left':'right'} half is lighter.`:'Left and right halves are balanced in brightness.'];
 const int=[w>co?'You may be drawn to warm, enclosing palettes.':'You may favour cool, calm palettes.',Sa<.2?'Muted colour could suggest a taste for subtlety and quiet atmosphere.':'Strong colour could suggest a taste for vividness.',ce>ed+.06?'A bright centre may point toward a clear focal subject.':'Without a bright focal centre, the eye may wander, which can feel spacious or unresolved.'];
 const qs=['Why did you choose these colours rather than the reference palette?','Which part did you enjoy painting most, and which did you avoid?','Do any shapes or colours recur in your other work or journaling?','Does the painting match what you meant, or did it surprise you?'];
 p.an=`<div class="card" style="margin:10px 0 0"><h3>Observed (from the photo’s pixels)</h3><div>${top.map(c=>`<span class="sw" style="background:${c}"></span>`).join('')}</div><ul>${obs.map(o=>`<li>${o}</li>`).join('')}</ul>
 <h3>Possible interpretation</h3><p class="mu">Speculative, drawn from colour and layout only${p.note?` and from your own words (“${esc(p.note.slice(0,120))}”)`:''}. You are the authority on what it means.</p><ul>${int.map(o=>`<li>${o}</li>`).join('')}</ul>
 <h3>Questions to sit with</h3><ul>${qs.map(o=>`<li>${o}</li>`).join('')}</ul><small>This is a playful reflection on creative choices, not a psychological assessment.</small></div>`;sv();r()};im.src=p.img}
function saved(){$('#v').innerHTML=S.saved.length?S.saved.map(i=>{const t=T[i];return`<div class="card"><small>${CN[t.c]} · ${t.o}</small><h3>${t.t}</h3><p>${t.d}</p><div class="row"><button class="pr" onclick="S.cur=${i};S.tab='g';sv();r()">Journal this</button><button onclick="S.saved=S.saved.filter(x=>x!=${i});sv();r()">Remove</button></div></div>`}).join(''):'<div class="card">Nothing saved yet. Tap “Save for Later” on anything that catches your eye.</div>'}
function r(){
 $('#cnt').textContent=S.done.length+' explored';
 $('#nav').innerHTML=[['g','Pond'],['c','Cats'],['p','Paintings'],['s','Saved']].map(a=>`<button class="${S.tab==a[0]?'on':''}" onclick="S.tab='${a[0]}';sv();r()">${a[1]}</button>`).join('');
 ({g:gard,c:cats,p:paint,s:saved})[S.tab]();
 const o=$('#ovh');if(o)o.remove();if(ov){const d=document.createElement('div');d.id='ovh';d.innerHTML=ov;document.body.appendChild(d)}}
for(let i=0;i<14;i++){const p=document.createElement('span');p.className='pa';p.style.left=Math.random()*100+'%';p.style.animationDelay=-Math.random()*16+'s';p.style.animationDuration=14+Math.random()*10+'s';$('#fx').appendChild(p)}
setInterval(()=>petals(1),15000);
r();
</script></body></html>
